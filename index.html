<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kisscut - sticker sheet maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='none' stroke='%23e5127f' stroke-width='2.5' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3"/><circle cx="16" cy="16" r="5" fill="currentColor"/></svg>
      <span>Kisscut</span>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="bar-actions">
      <button class="btn" id="btnExport" type="button">Export</button>
      <button class="btn primary" id="btnPack" type="button">Pack sheet</button>
    </div>
  </header>

  <aside class="panel">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="stickers" aria-selected="true">Stickers</button>
      <button role="tab" data-tab="sheet" aria-selected="false">Sheet</button>
      <button role="tab" data-tab="export" aria-selected="false">Export</button>
    </nav>
    <div class="pane" id="pane-stickers"></div>
    <div class="pane" id="pane-sheet" hidden></div>
    <div class="pane" id="pane-export" hidden></div>
  </aside>

  <main class="stage" id="stage">
    <div class="stage-scroll" id="scroll">
      <div class="paper" id="paper"></div>
    </div>
    <div class="empty" id="empty">
      <h1>Drop your artwork here</h1>
      <p>SVG, PNG, WebP or JPG. Each one gets a die-cut outline and a share of an A4 sheet, ready to print.</p>
      <div class="empty-actions">
        <button class="btn primary" type="button" id="emptyPick">Choose files</button>
        <button class="btn" type="button" id="emptySamples">Try the examples</button>
      </div>
    </div>
    <div class="zoom" id="zoom">
      <button type="button" id="zOut" aria-label="Zoom out">-</button>
      <button type="button" id="zFit" class="zfit">Fit</button>
      <button type="button" id="zIn" aria-label="Zoom in">+</button>
    </div>
    <div class="dropveil" id="veil">Drop to add</div>
  </main>
</div>
<input type="file" id="file" accept="image/*,.svg" multiple hidden>
<div id="printHost" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="geometry.js"></script>
<script src="shapes.js"></script>
<script src="pack.js"></script>
<script src="render.js"></script>
<script src="samples.js"></script>
<script src="app.js"></script>
</body>
</html>
